name: Test and deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-deploy:
    name: Test, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Web-Abhängigkeiten installieren
        run: npm ci

      - name: Firebase-Functions-Abhängigkeiten installieren
        run: npm ci --prefix functions

      - name: Tests ausführen
        run: npm test

      - name: Hosting-Build erstellen
        run: npm run build

      - name: Media-Lounge-Dateien prüfen
        run: |
          test -s dist/index.html
          test -s dist/live-media.js
          test -s dist/media-lounge-player.css
          grep -q "media-lounge-player.css" dist/index.html
          echo "Media-Lounge-Build erfolgreich geprüft."

      - name: Zu Firebase Hosting deployen
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOORI_MESSENGER }}
          projectId: doori-messenger
          channelId: live
