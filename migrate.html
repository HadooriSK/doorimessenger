<!DOCTYPE html>
<html>
<head>
    <title>Migrate Users</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js?v=25"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #111; color: #fff; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #00d2d3; color: #000; border: none; border-radius: 5px; }
        #log { margin-top: 20px; white-space: pre-wrap; font-family: monospace; background: #222; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>User Migration (6-Digit ID)</h2>
    <p>Achtung: Bevor du auf den Button klickst, musst du in der Firebase Console unter <b>Firestore Database -> Rules</b> kurzzeitig folgende Regel setzen:<br>
    <code>allow read, write: if true;</code><br>
    Vergiss nicht, die Regel nach der Migration wieder zurückzusetzen!</p>
    <button id="btn">Migrate Existing Users</button>
    <div id="log"></div>

    <script>
        const logEl = document.getElementById('log');
        function log(msg) { logEl.textContent += msg + '\n'; console.log(msg); }

        document.getElementById('btn').addEventListener('click', async () => {
            document.getElementById('btn').disabled = true;
            log("Starte Migration...");
            try {
                const snapshot = await db.collection('users').get();
                if (snapshot.empty) { log("Keine Benutzer gefunden."); return; }
                
                for (const doc of snapshot.docs) {
                    const data = doc.data();
                    const username = data.username;
                    const email = data.email;
                    
                    if (data.id_number) {
                        log(`Überspringe ${username} - hat bereits eine ID (${data.id_number}).`);
                        continue;
                    }
                    
                    if (!email) {
                        log(`Überspringe ${username} - keine E-Mail Adresse hinterlegt.`);
                        continue;
                    }

                    const generatedId = Math.floor(100000 + Math.random() * 900000).toString();
                    log(`Aktualisiere ${username} mit ID ${generatedId}...`);
                    
                    // 1. Update Firestore
                    await doc.ref.update({ id_number: generatedId });
                    
                    // 2. Send Email via Brevo
                    try {
                        const response = await fetch('https://api.brevo.com/v3/smtp/email', {
                          method: 'POST',
                          headers: {
                            'Accept': 'application/json',
                            'api-key': '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',
                            'Content-Type': 'application/json'
                          },
                          body: JSON.stringify({
                            sender: { name: "Doori Messenger", email: "noreply@doori-messenger.de" },
                            to: [{ email: email }],
                            subject: "Wichtig: Dein neues Doori Messenger Login-System",
                            htmlContent: `<html><body><h2>Hallo ${username},</h2><p>Wir haben unser Login-System noch sicherer gemacht.</p><p>Für deinen zukünftigen Login benötigst du ab sofort neben deinem Benutzernamen und Passwort auch diese automatisch generierte 6-stellige ID-Nummer:</p><h3>Deine ID-Nummer: ${generatedId}</h3><p>Bitte bewahre diese Daten sicher auf!</p></body></html>`
                          })
                        });
                        
                        if (response.ok) {
                            log(`-> E-Mail an ${email} gesendet.`);
                        } else {
                            log(`-> Fehler beim E-Mail Versand an ${email}: ${response.statusText}`);
                        }
                    } catch(err) {
                        log(`-> Exception beim E-Mail Versand an ${email}: ${err.message}`);
                    }
                }
                log("Migration abgeschlossen! Bitte setze die Firestore-Regeln wieder auf den alten Stand zurück.");
            } catch (error) {
                log("FEHLER: " + error.message);
                if (error.message.includes("Missing or insufficient permissions")) {
                    log("-> Dies bedeutet, dass die Firestore-Regeln nicht auf 'allow read, write: if true;' gesetzt wurden.");
                }
            }
            document.getElementById('btn').disabled = false;
        });
    </script>
</body>
</html>
