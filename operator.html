<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doori Operator Console</title><link rel="stylesheet" href="operator.css?v=1"></head><body><main class="shell"><header><img src="logo.png" alt="Doori"><div><h1 data-t="title">Doori Betreiber-Konsole</h1><p data-t="subtitle">Geschützte KI-Verbrauchsübersicht</p></div><select id="lang"><option value="de">Deutsch</option><option value="en">English</option><option value="ar">العربية</option><option value="fa">فارسی</option><option value="tr">Türkçe</option></select></header>
<section id="login" class="panel"><h2 data-t="login">Betreiber-Anmeldung</h2><input id="email" type="email" data-p="email" placeholder="E-Mail"><input id="password" type="password" data-p="password" placeholder="Passwort"><button id="login-btn" data-t="loginButton">Anmelden</button><p id="login-error"></p></section>
<section id="dashboard" class="hidden"><div class="toolbar"><span id="updated"></span><button id="refresh" data-t="refresh">Aktualisieren</button><button id="logout" data-t="logout">Abmelden</button></div><div class="cards"><article><span data-t="activeUsers">Aktive Nutzer heute</span><strong id="active-users">0</strong></article><article><span data-t="textRequests">Textnachrichten heute</span><strong id="text-total">0</strong></article><article><span data-t="voiceTime">Sprachzeit heute</span><strong id="voice-total">0 min</strong></article><article><span data-t="switches">Automatische Wechsel</span><strong id="switch-total">0</strong></article></div>
<section class="panel"><h2 data-t="providers">Anbieter heute</h2><div class="table-wrap"><table><thead><tr><th data-t="provider">Anbieter</th><th data-t="requests">Requests</th><th data-t="tokens">Tokens</th><th data-t="utilization">Auslastung</th><th data-t="remaining">Verbleibend</th><th data-t="errors">Fehler</th><th data-t="timeouts">Timeouts</th></tr></thead><tbody id="provider-rows"></tbody></table></div></section>
<section class="panel"><h2 data-t="limits">Zentrale Tageslimits</h2><form id="config-form" class="config-grid"><label><span data-t="textLimit">Text pro Nutzer</span><input name="textMessagesPerUser" type="number" min="1"></label><label><span data-t="voiceLimit">Sprachminuten pro Nutzer</span><input name="voiceMinutes" type="number" min="1"></label><label>Groq<input name="groqDailyRequests" type="number" min="1"></label><label>Gemini<input name="geminiDailyRequests" type="number" min="1"></label><label>Cloudflare<input name="cloudflareDailyRequests" type="number" min="1"></label><label><span data-t="timeout">Wechsel nach Millisekunden</span><input name="providerTimeoutMs" type="number" min="1000"></label><button data-t="save" type="submit">Speichern</button></form><p id="save-state"></p></section></section></main>
<script src="vendor/firebase-app-compat.js"></script><script src="vendor/firebase-auth-compat.js"></script><script src="vendor/firebase-firestore-compat.js"></script><script src="vendor/firebase-functions-compat.js"></script><script src="firebase-config.js?v=28"></script><script src="operator.js?v=1"></script></body></html>
